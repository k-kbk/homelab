---
# Balanced defaults for a general-purpose Ubuntu home server.  Each group can
# be disabled independently, and individual values can be replaced through
# server_tuning_sysctl_overrides (including -e on the command line).
server_tuning_security_enabled: true
server_tuning_network_enabled: true
server_tuning_performance_enabled: true

# Keep BBR opt-in: it is useful for WAN-heavy hosts, but changes TCP behaviour
# and is not available on every Ubuntu kernel.
server_tuning_bbr_enabled: false

server_tuning_security_sysctl:
  # Limit kernel information exposed to unprivileged users without disabling
  # normal debugging tools for root.
  kernel.dmesg_restrict: "1"
  kernel.kptr_restrict: "1"
  kernel.perf_event_paranoid: "2"
  # Value 2 keeps unprivileged BPF disabled but, unlike 1, lets root reverse
  # the setting later without requiring a reboot.
  kernel.unprivileged_bpf_disabled: "2"
  kernel.yama.ptrace_scope: "1"
  kernel.randomize_va_space: "2"

  # Protect files in shared writable directories such as /tmp.
  fs.protected_fifos: "1"
  fs.protected_hardlinks: "1"
  fs.protected_regular: "1"
  fs.protected_symlinks: "1"
  fs.suid_dumpable: "0"

server_tuning_network_sysctl:
  # Loose reverse-path filtering works with Tailscale and other multi-homed
  # setups; strict mode (1) can silently drop valid asymmetric traffic.
  net.ipv4.conf.all.rp_filter: "2"
  net.ipv4.conf.default.rp_filter: "2"

  # A server should not learn routes from ICMP redirects or source-routed
  # packets.  Do not set ip_forward here because setup-vpn.yaml owns it.
  net.ipv4.conf.all.accept_redirects: "0"
  net.ipv4.conf.default.accept_redirects: "0"
  net.ipv4.conf.all.secure_redirects: "0"
  net.ipv4.conf.default.secure_redirects: "0"
  net.ipv4.conf.all.send_redirects: "0"
  net.ipv4.conf.default.send_redirects: "0"
  net.ipv4.conf.all.accept_source_route: "0"
  net.ipv4.conf.default.accept_source_route: "0"
  net.ipv6.conf.all.accept_redirects: "0"
  net.ipv6.conf.default.accept_redirects: "0"
  net.ipv6.conf.all.accept_source_route: "0"
  net.ipv6.conf.default.accept_source_route: "0"

  net.ipv4.icmp_echo_ignore_broadcasts: "1"
  net.ipv4.icmp_ignore_bogus_error_responses: "1"
  net.ipv4.tcp_syncookies: "1"
  net.ipv4.tcp_rfc1337: "1"

server_tuning_performance_sysctl:
  # Conservative queue and socket-buffer increases for 1/2.5 GbE home
  # networks.  Applications remain free to request smaller buffers.
  net.core.netdev_max_backlog: "4096"
  net.core.somaxconn: "4096"
  net.core.rmem_default: "262144"
  net.core.wmem_default: "262144"
  net.core.rmem_max: "16777216"
  net.core.wmem_max: "16777216"
  net.ipv4.tcp_max_syn_backlog: "4096"
  net.ipv4.tcp_rmem: "4096 262144 16777216"
  net.ipv4.tcp_wmem: "4096 262144 16777216"

  # Detect dead peers sooner while avoiding aggressive connection recycling.
  net.ipv4.tcp_fin_timeout: "30"
  net.ipv4.tcp_keepalive_time: "600"
  net.ipv4.tcp_keepalive_intvl: "60"
  net.ipv4.tcp_keepalive_probes: "5"

  # Avoid large writeback spikes and retain filesystem metadata a little
  # longer.  These values are intentionally milder than database tuning.
  vm.swappiness: "10"
  vm.vfs_cache_pressure: "50"
  vm.dirty_background_ratio: "5"
  vm.dirty_ratio: "15"

  # Practical headroom for containers, file watchers, and search/index tools.
  fs.inotify.max_user_instances: "1024"
  fs.inotify.max_user_watches: "524288"
  vm.max_map_count: "262144"

server_tuning_bbr_sysctl:
  net.core.default_qdisc: fq
  net.ipv4.tcp_congestion_control: bbr
