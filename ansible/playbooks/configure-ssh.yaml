---
- name: Configure and harden SSH authentication
  hosts: nodes
  serial: 1
  become: true

  tasks:
    - name: Install SSH public keys
      ansible.posix.authorized_key:
        user: "{{ item.user }}"
        state: present
        key: "{{ lookup('file', lookup('env', 'HOME') + '/.ssh/' + item.key) }}"
      loop:
        - user: bk
          key: id_ed25519_bk.pub
        - user: ansible
          key: id_ed25519_ansible.pub
      loop_control:
        label: "{{ item.user }}"

    - name: Harden SSH authentication
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-ansible-hardening.conf
        owner: root
        group: root
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
        content: |
          # Managed by Ansible
          PubkeyAuthentication yes
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitEmptyPasswords no
          PermitRootLogin no
          MaxAuthTries 3
      notify: Reload SSH

  handlers:
    - name: Reload SSH
      ansible.builtin.systemd_service:
        name: ssh.service
        state: reloaded
