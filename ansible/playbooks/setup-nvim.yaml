---
- name: Configure Neovim as default editor
  hosts: nodes

  vars:
    nvim_user: bk
    nvim_home: "/home/{{ nvim_user }}"

  tasks:
  - name: Install Neovim
    ansible.builtin.apt:
      name: neovim
      state: present
      update_cache: true

  - name: Set Neovim as default editor
    community.general.alternatives:
      name: editor
      path: /usr/bin/nvim

  - name: Set Neovim as default vi
    community.general.alternatives:
      name: vi
      path: /usr/bin/nvim
      state: selected

  - name: Configure Neovim aliases in .bashrc
    ansible.builtin.blockinfile:
      path: "/home/{{ nvim_user }}/.bashrc"
      marker: "# {mark} Neovim"
      block: |
        export EDITOR=nvim
        export VISUAL=nvim
        alias vi='nvim'
        alias vim='nvim'
      owner: "{{ nvim_user }}"
      group: "{{ nvim_user }}"
      mode: "0644"
