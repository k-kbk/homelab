---
- name: Configure NTP synchronization
  hosts: nodes
  become: true

  vars_files:
    - ../inventory/group_vars/ntp.yaml

  tasks:
    - name: Install chrony
      ansible.builtin.apt:
        name: chrony
        state: present
        update_cache: true
        cache_valid_time: 86400

    - name: Configure timezone
      community.general.timezone:
        name: "{{ ntp_timezone }}"

    - name: Remove default Ubuntu NTP sources
      ansible.builtin.file:
        path: /etc/chrony/sources.d/ubuntu-ntp-pools.sources
        state: absent
      notify: Reload chrony sources

    - name: Configure NTP sources
      ansible.builtin.template:
        src: chrony/homelab.sources.j2
        dest: /etc/chrony/sources.d/homelab.sources
        owner: root
        group: root
        mode: "0644"
      notify: Reload chrony sources

    - name: Enable and start chrony
      ansible.builtin.systemd_service:
        name: chrony
        enabled: true
        state: started

    - name: Apply NTP source changes
      ansible.builtin.meta: flush_handlers

    - name: Verify chrony is responding
      ansible.builtin.command:
        cmd: chronyc tracking
      register: ntp_tracking
      changed_when: false
      failed_when:
        - ntp_tracking.rc != 0
        - not ansible_check_mode

  handlers:
    - name: Reload chrony sources
      ansible.builtin.command:
        cmd: chronyc reload sources
      changed_when: true
